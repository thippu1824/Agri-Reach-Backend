spring:
  application:
    name: agrireach-backend
  # PostgreSQL database connection
  datasource:
    url: jdbc:postgresql://localhost:5432/agrireach
    username: agrireach_app
    password: root
    driver-class-name: org.postgresql.Driver
  # JPA and Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Flyway database migration configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
# Application server
server:
  port: 8080
# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000
  bootstrap-admin:
    username: admin
    password: admin
    email: admin@yopmail.com